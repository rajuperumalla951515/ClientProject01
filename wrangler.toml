# Sri Adithya Organics — Cloudflare Python Worker Configuration
name = "sriadithyaorganics"
main = "entry.py"
compatibility_date = "2026-11-05"
compatibility_flags = ["python_workers"]

# Cloudflare D1 Database Binding
# Note: Bind your D1 database directly in Cloudflare Dashboard:
# Go to Workers & Pages -> sriadithyaorganics -> Settings -> Bindings -> Add binding -> D1 database:
# Variable name: DB -> D1 database: sri-adithya-db
# Alternatively, if deploying via Wrangler CLI, uncomment the lines below and enter your database UUID:
# [[d1_databases]]
# binding = "DB"
# database_name = "sri-adithya-db"
# database_id = "<YOUR_D1_DATABASE_UUID>"

[vars]
ENVIRONMENT = "production"
PROJECT_NAME = "Sri Adithya Organics API"
VERSION = "1.0.0"
WHATSAPP_NUMBER = "919515159006"
DEFAULT_MIN_ORDER_AMOUNT = "99.0"
DEFAULT_FREE_DELIVERY_THRESHOLD = "499.0"
DEFAULT_STANDARD_DELIVERY_FEE = "39.0"
DEFAULT_EXPRESS_DELIVERY_FEE = "59.0"
