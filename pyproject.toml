[project]
name = "sriadithyaorganics"
version = "1.0.0"
description = "Sri Adithya Organics FastAPI Backend on Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.28",
    "pg8000>=1.30.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]


